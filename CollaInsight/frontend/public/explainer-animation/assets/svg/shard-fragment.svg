<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Knowledge shard — original geometric fragment, five brand-taxonomy colors</title>
  <!--
    One irregular quadrilateral used for every "scattered knowledge" fragment
    in the animation. Recolor via the fill on each instance to match the
    product's knowledge-type taxonomy (see docs/product/12_UI_UX_SPECIFICATION.md):
    blue = research/structured data, cyan = AI insight, violet = collaboration,
    emerald = metric/success, amber = alert/pending.
  -->
  <polygon id="shard-fragment-shape" points="40,10 82,26 102,64 66,110" fill="#2563eb" opacity="0.85" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
</svg>
