<svg width="185" height="90" viewBox="730 -5 185 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>CollainSight — three-node graph accent (animation-only reinterpretation)</title>
  <!--
    The real brand file (assests/CollaInsight full logo - white.svg) draws
    this accent as a tight two-segment zigzag, which reads as a single
    spark/flash at explainer scale rather than three distinct nodes. This
    version keeps the same 3-circles-plus-edges concept but spreads the
    nodes into a wider triangle with all three edges drawn, so it reads
    clearly as a small network/graph glyph next to the wordmark. Used only
    in explainer-animation/index.html (#scene8-graph-accent) — not a literal
    copy of the logo file the way logo-mark.svg is.
  -->
  <defs>
    <linearGradient id="accent-grad" x1="745" y1="8" x2="900" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" />
      <stop offset="0.5" stop-color="#06B6D4" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <path id="accent-edge-1" d="M745,68 L815,8" fill="none" stroke="url(#accent-grad)" stroke-width="4.2" />
  <path id="accent-edge-2" d="M815,8 L900,55" fill="none" stroke="url(#accent-grad)" stroke-width="4.2" />
  <path id="accent-edge-3" d="M745,68 L900,55" fill="none" stroke="url(#accent-grad)" stroke-width="4.2" />
  <circle id="accent-node-1" cx="745" cy="68" r="10" fill="url(#accent-grad)" />
  <circle id="accent-node-2" cx="815" cy="8" r="10" fill="url(#accent-grad)" />
  <circle id="accent-node-3" cx="900" cy="55" r="10" fill="url(#accent-grad)" />
</svg>
