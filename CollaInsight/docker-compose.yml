# CollaInsight local development environment.
#
# Runs n8n locally, as an optional alternative to the current live setup
# (n8n Cloud, with the Python backend running separately on the host - see
# RUNNING_NGROK_AND_N8N.md for that primary path). Useful for experimenting
# with the n8n workflow itself without touching the live Cloud instance.
# Telegram, the LLM provider, and Supabase are NOT configured here - those
# are entered as n8n credentials/workflow steps inside n8n, not as container
# environment variables.
#
# `ngrok` gives this local n8n instance a public HTTPS URL so Telegram's
# webhook can reach it - a separate tunnel from the one RUNNING_NGROK_AND_N8N.md
# uses to expose the backend. Free plan includes one persistent static domain
# per account (see .env.example for how to get it), so this URL does NOT
# change across restarts - no sync script needed. ngrok was selected after
# testing cloudflared (Quick Tunnel) and tailscale (Funnel) as alternatives;
# both were dropped in favor of ngrok's stable reserved domain.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.0
    container_name: collainsight-n8n
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n

  ngrok:
    image: ngrok/ngrok:latest
    container_name: collainsight-tunnel
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http n8n:5678 --url ${NGROK_DOMAIN}
    depends_on:
      - n8n

volumes:
  n8n_data:
    name: collainsight_n8n_data
